# Node 26 drift detector — informational only, never blocks merges.
#
# Weekly + manual. Installs the pinned Node 24.20.0 and the target Node
# 26.13.1 from nodejs.org/dist (SHA256-verified), regenerates the
# export-surface diff and the Node 26 baseline, and uploads them as
# artifacts. It does NOT run the full parity suite, does NOT run jest, and
# does NOT commit anything: the checked-in files under parity/drift/ are
# regenerated by the drift worker and committed by hand when a bump is
# planned. A weekly run whose artifacts differ from the checked-in files is
# the signal that Node moved and the detector inputs need re-pinning.
name: Node 26 Drift

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  drift:
    name: Drift detector
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download Node 24.20.0 + 26.13.1 (SHA256-verified)
        run: |
          set -euo pipefail
          mkdir -p /tmp/node-dl /tmp/node24 /tmp/node26 /tmp/node26-src
          cd /tmp/node-dl
          curl -sS -o SHASUMS256-24.20.0.txt https://nodejs.org/dist/v24.20.0/SHASUMS256.txt
          curl -sS -o node-v24.20.0-linux-x64.tar.xz https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz
          curl -sS -o SHASUMS256-26.13.1.txt https://nodejs.org/dist/v26.13.1/SHASUMS256.txt
          curl -sS -o node-v26.13.1-linux-x64.tar.xz https://nodejs.org/dist/v26.13.1/node-v26.13.1-linux-x64.tar.xz
          curl -sS -o node-v26.13.1.tar.gz https://nodejs.org/dist/v26.13.1/node-v26.13.1.tar.gz
          grep "node-v24.20.0-linux-x64.tar.xz" SHASUMS256-24.20.0.txt | sha256sum -c -
          grep "node-v26.13.1-linux-x64.tar.xz" SHASUMS256-26.13.1.txt | sha256sum -c -
          grep "node-v26.13.1.tar.gz" SHASUMS256-26.13.1.txt | sha256sum -c -
          tar -xJf node-v24.20.0-linux-x64.tar.xz -C /tmp/node24 --strip-components=1
          tar -xJf node-v26.13.1-linux-x64.tar.xz -C /tmp/node26 --strip-components=1
          tar -xzf node-v26.13.1.tar.gz -C /tmp/node26-src --strip-components=1
          /tmp/node24/bin/node --version
          /tmp/node26/bin/node --version

      - name: Harness Node on PATH (pinned 24.20.0)
        run: echo "/tmp/node24/bin" >> "$GITHUB_PATH"

      - name: Export-surface diff
        run: node parity/drift/export-diff.mjs --node24 /tmp/node24/bin/node --node26 /tmp/node26/bin/node

      - name: Node 26 baseline
        # run-baseline stages the Node 26 test tree into parity/node-test/ of
        # this checkout and restores it afterwards; it refuses if that
        # directory is dirty. --jobs 4: CI runners have headroom the VM does
        # not (local runs use --jobs 2 per the OOM lesson).
        run: node parity/drift/run-baseline.mjs --node26-src /tmp/node26-src --worktree . --out parity/drift/node26-baseline.jsonc --csv-dir /tmp/drift-csv --jobs 4

      - name: Native oracle
        run: node parity/drift/run-oracle.mjs --node26-src /tmp/node26-src --node26-bin /tmp/node26/bin/node --baseline parity/drift/node26-baseline.jsonc --out parity/drift/node26-oracle.json --jobs 4

      - name: Upload drift outputs
        uses: actions/upload-artifact@v4
        with:
          name: node26-drift
          path: |
            parity/drift/node26-export-diff.md
            parity/drift/exports-node24.20.0.json
            parity/drift/exports-node26.13.1.json
            parity/drift/node26-baseline.jsonc
            parity/drift/node26-oracle.json
            /tmp/drift-csv/
