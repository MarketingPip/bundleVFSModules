name: Build VFS

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # The jest suite differentially tests the shims against the real
          # Node builtins (node:module, node:tls, node:constants, ...).
          # Those surfaces are captured from Node v24.20.0, so the test
          # runner must be that exact release — same pin as the parity job.
          node-version: 24.20.0


      - name: Install dependencies
        run: |
          npm install
          npm install  als-browser magic-string acorn-walk acorn @noble/hashes @noble/ciphers @noble/curves node-forge node-fetch jest @bjorn3/browser_wasi_shim web-streams-polyfill brotli pako browser-stdout easy-table timers-browserify path-browserify string_decoder setimmediate punycode serialize-javascript browserify-zlib constants-browserify terser assert vm-browserify querystring-browser http-browserify base32-encode dohjs dns-packet stream-browserify https-browserify crypto-browserify stream events

      - name: Run Tests
        run: npm test

      - name: Build VFS
        run: node src/build-vfs.mjs

      - name: Commit generated file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/*.js
          git diff --cached --exit-code || git commit -m "chore: regenerate vfs.js"
          git push

  parity:
    name: Parity (Node official tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # The vendored suite in parity/node-test comes from Node v24.20.0;
          # pin the exact release so the test harness matches it.
          node-version: 24.20.0

      - name: Run official parity tests
        run: |
          set -euo pipefail
          # Modules at 100% official parity with an empty
          # parity/expected-failures.json.
          for module in path punycode querystring string_decoder events assert; do
            echo "::group::parity: ${module}"
            node parity/run.mjs "${module}"
            echo "::endgroup::"
          done
