<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Consumption-path E2E</title></head>
<body>
<div id="out">pending</div>
<script type="module">
// Genuine full-consumption-path E2E (Jared, 2026-09-30).
//
// Uses ONLY the real public surface:
//   - `CodeSandbox` / `transformImportsToLoadModule` imported from the REAL
//     /local-repo/runtime.js (worktree file; the driver serves it with ONLY
//     _builtinBaseUrl rewritten to the local worktree dist/)
//   - `sandbox.execute(userCode)` runs the REAL pipeline:
//     ImportResolver -> transformImportsToLoadModule -> SandboxRuntime.generate
//     -> iframe bootstrap -> user code -> window.parent.postMessage
//     ({type:'function_results', logs...}) -> result.logs
//   - `import { createRequire } from "node:module"` loads the REAL node:module
//     shim (local dist/module.js) through the REAL _dynamic_import interop;
//     `require("express")` resolves through the REAL parent
//     _dynamic_import/resolveNodeModule; `require.resolve(...)` runs the REAL
//     Module._resolveFilename in dist/module.js; CJS modules required through
//     the interop run through the REAL wrapCommonJS+createSyncRequire.
//
// Jared's exact scenario, from ESM:
//   import { createRequire } from "node:module";
//   const require = createRequire(import.meta.url);
//   const express = require("express");
//   const config = require("./config.json");
//   const lodashPath = require.resolve("lodash");
//
// Reports via document.title ("E2E-PASS" / "E2E-FAIL: ..."), #out text, and
// POST /report (crash-proof). No screenshots.
const out = document.getElementById("out");
const log = (m) => { out.textContent += "\n" + m; };
const __t0 = Date.now();
const phase = (p) => { window.__phase = p; document.title = "E2E:" + p; log("PHASE " + p + " @" + ((Date.now() - __t0) / 1000).toFixed(1) + "s"); };
const report = (v) => {
  window.__done__ = v;
  try {
    fetch("/report", { method: "POST", body: JSON.stringify(v), keepalive: true }).catch(() => {});
  } catch (e) { /* ignore */ }
};

const results = [];
const check = (name, cond, extra) => {
  results.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : " :: " + (extra || "")));
};

try {
  // ---- 0. Real public host runtime ----
  const rt = await import("/local-repo/runtime.js");
  check("real runtime exports CodeSandbox", typeof rt.CodeSandbox === "function");
  check("real runtime exports transformImportsToLoadModule", typeof rt.transformImportsToLoadModule === "function");
  const { CodeSandbox, transformImportsToLoadModule } = rt;
  phase("runtime-loaded");

  // ---- 1. Real transformImportsToLoadModule (called directly) ----
  const probeSrc = 'import { createRequire } from "node:module";\nconst u = import.meta.url;';
  const probe = transformImportsToLoadModule("probe-uuid", probeSrc, "consumer.mjs");
  check("transform: import.meta.url -> 'file:///consumer.mjs'",
    probe.code.includes("'file:///consumer.mjs'"), probe.code.slice(0, 200));
  check("transform: static import -> loadModule(\"node:module\")",
    /loadModule\(\s*["']node:module["']/.test(probe.code), probe.code.slice(0, 300));
  phase("transform-proven");

  // ---- 2. VFS seed ----
  const seed = {
    "/setup.mjs": [
      "globalThis.__setupOrder = (globalThis.__setupOrder || []).concat(['setup']);",
      "globalThis.__sharedValue = 'from-setup';",
      "export const setupDone = true;",
    ].join("\n"),
    "/node_modules/express/package.json": JSON.stringify({
      name: "express", version: "5.0.0",
      exports: { ".": { require: "./cjs.js", import: "./esm.js" } },
    }),
    "/node_modules/express/cjs.js":
      'module.exports = { flavor: "cjs-via-exports" };',
    "/node_modules/express/esm.js":
      'export const flavor = "esm-via-exports";',
    "/config.json": JSON.stringify({ theme: "dark", version: 2 }),
    "/node_modules/lodash/package.json": JSON.stringify({
      name: "lodash", version: "4.17.21", main: "lodash.js",
    }),
    "/node_modules/lodash/lodash.js":
      "globalThis.__lodashExecuted = true;\nmodule.exports = { lodash: true };",
    "/cjs-check.js": [
      "module.exports = {",
      "  thisIsExports: (function(){ return this === module.exports; })(),",
      "  thisNotGlobal: (function(){ return this !== globalThis; })(),",
      "  filename: __filename,",
      "  dirname: __dirname,",
      "  seesShared: globalThis.__sharedValue === 'from-setup',",
      "};",
    ].join("\n"),
  };

  // ---- 3. Entry: Jared's exact scenario, from ESM ----
  // NOTE: the runtime's transform lifts EVERY require("x") call in the entry
  // into `await loadModule("x", "require", ...)` (async interop path through
  // the parent _dynamic_import). require.resolve("lodash") is NOT lifted
  // (MemberExpression callee), so it runs the REAL createRequire require
  // (dist/module.js Module._resolveFilename) synchronously.
  const userCode = [
    'import { createRequire } from "node:module";',
    'import { setupDone } from "./setup.mjs";',
    "const __hold = setTimeout(() => {}, 170000);",
    "const __metaUrl = import.meta.url;",
    "const require = createRequire(import.meta.url);",
    'globalThis.__setupOrder = (globalThis.__setupOrder || []).concat(["consumer"]);',
    'const express = require("express");',
    'const config = require("./config.json");',
    'const lodashPath = require.resolve("lodash");',
    'const expressPath = require.resolve("express");',
    'const cjsCheck = require("./cjs-check.js");',
    "const __results = {",
    "  setupDone: setupDone,",
    "  setupOrder: globalThis.__setupOrder,",
    "  sharedValue: globalThis.__sharedValue,",
    "  metaUrl: __metaUrl,",
    "  expressFlavor: express && express.flavor,",
    "  configTheme: config && config.theme,",
    "  lodashPath: lodashPath,",
    "  lodashExecuted: globalThis.__lodashExecuted === true,",
    "  expressPath: expressPath,",
    "  cjs: cjsCheck,",
    "};",
    "clearTimeout(__hold);",
    'console.log("__CONSUMPTION_E2E__" + JSON.stringify(__results));',
  ].join("\n");

  const sandbox = new CodeSandbox({
    fs: seed,
    fileName: "consumer.mjs",
    timeout: 180000,
    process: { env: {} },
    fallbackCDN: false,
  });
  phase("sandbox-constructed");

  setTimeout(() => {
    if (!window.__done__) report({ ok: false, phase: "watchdog", lastPhase: window.__phase || null });
  }, 175000);

  let result;
  try {
    phase("execute-start");
    result = await sandbox.execute(userCode);
    phase("execute-resolved");
  } catch (e) {
    report({ ok: false, phase: "execute", error: String((e && e.message) || e).slice(0, 2000) });
    document.title = "E2E-FAIL: execute threw: " + String((e && e.message) || e).slice(0, 120);
    log("execute REJECTED: " + String((e && e.message) || e).slice(0, 500));
    throw e;
  }

  // ---- 4. The verdict came back through the REAL postMessage channel ----
  // (generate()'s template posts {type:'function_results', logs...}; the
  // parent resolves execute() from it). result.success===true proves the
  // EMITTED SandboxRuntime.generate output executed.
  check("generate: execute() resolved via postMessage channel (result.success===true)",
    result && result.success === true, JSON.stringify(result && { success: result.success, errors: result.errors }).slice(0, 300));

  const logEntries = (result.logs || []).map((l) => (typeof l === "string" ? l : JSON.stringify(l)));
  let r = null;
  for (const entry of logEntries) {
    let raw = entry;
    try {
      const parsed = JSON.parse(entry);
      if (parsed && typeof parsed.args === "string") raw = parsed.args;
    } catch (e) {}
    const j = raw.indexOf("__CONSUMPTION_E2E__");
    if (j !== -1) {
      try { r = JSON.parse(raw.slice(j + 20)); break; }
      catch (e) { r = { __parseError: raw.slice(j, j + 300) }; break; }
    }
  }
  check("postMessage: __CONSUMPTION_E2E__ marker arrived via result.logs", !!r && !r.__parseError,
    "logs=" + logEntries.length);
  phase("marker-parsed");
  if (!r || r.__parseError) throw new Error("no E2E marker in logs");

  // ---- 5. Jared's assertion set ----
  check("ESM: setupDone is true", r.setupDone === true, JSON.stringify(r.setupDone));
  check("ESM: static-import ordering ['setup','consumer']",
    Array.isArray(r.setupOrder) && r.setupOrder[0] === "setup" && r.setupOrder[1] === "consumer",
    JSON.stringify(r.setupOrder));
  check("ESM: setup globalThis mutation visible", r.sharedValue === "from-setup", JSON.stringify(r.sharedValue));
  check("ESM: createRequire(import.meta.url) — metaUrl is file:///consumer.mjs",
    r.metaUrl === "file:///consumer.mjs", JSON.stringify(r.metaUrl));
  check("exports: require() selects the require condition (cjs, not esm)",
    r.expressFlavor === "cjs-via-exports", JSON.stringify(r.expressFlavor));
  check("CJS: sync JSON loads", r.configTheme === "dark", JSON.stringify(r.configTheme));
  check("resolve: require.resolve('lodash') returns VFS path",
    r.lodashPath === "/node_modules/lodash/lodash.js", JSON.stringify(r.lodashPath));
  check("resolve: require.resolve does not execute its target",
    r.lodashExecuted === false, JSON.stringify(r.lodashExecuted));
  check("resolve: require.resolve('express') honors exports -> /node_modules/express/cjs.js",
    r.expressPath === "/node_modules/express/cjs.js", JSON.stringify(r.expressPath));
  check("CJS: this === module.exports", r.cjs && r.cjs.thisIsExports === true, JSON.stringify(r.cjs));
  check("CJS: this !== globalThis", r.cjs && r.cjs.thisNotGlobal === true, JSON.stringify(r.cjs));
  check("CJS: exact __filename", r.cjs && r.cjs.filename === "/cjs-check.js", JSON.stringify(r.cjs && r.cjs.filename));
  check("CJS: exact __dirname", r.cjs && r.cjs.dirname === "/", JSON.stringify(r.cjs && r.cjs.dirname));
  check("shared: CJS sees ESM setup globalThis", r.cjs && r.cjs.seesShared === true, JSON.stringify(r.cjs));

  const failures = results.filter((x) => x.startsWith("FAIL"));
  log(results.join("\n"));
  if (failures.length > 0) {
    document.title = "E2E-FAIL: " + failures[0].slice(5, 125);
    report({ ok: false, phase: "verdict", failures, results });
  } else {
    document.title = "E2E-PASS";
    report({ ok: true, phase: "verdict", results });
  }
} catch (e) {
  if (!window.__done__) {
    document.title = "E2E-FAIL: " + String((e && e.message) || e).slice(0, 120);
    report({ ok: false, phase: "harness-error", error: String((e && e.message) || e).slice(0, 1000) });
  }
  document.getElementById("out").textContent += "\nHARNESS ERROR: " + (e && e.stack);
}
</script>
</body>
</html>
