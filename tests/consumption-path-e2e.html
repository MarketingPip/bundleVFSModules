<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Consumption-path E2E</title></head>
<body>
<div id="out">pending</div>
<script>
// Full consumption-path E2E (Jared, 2026-09-30).
//
// Tests Jared's exact scenario with import.meta.url, using:
// 1. The REAL transformImportsToLoadModule() output (tests/consumption-transformed.js)
// 2. The GENUINE sync resolver from PR #137 (extracted from runtime.js, same as vfs-resolve-e2e.html)
// 3. Real ESM execution order and shared globalThis
//
// Reports via document.title ("E2E-PASS" / "E2E-FAIL: ...") and #out text.
(async () => {
  const out = [];
  const log = (k, v) => out.push(k + '=' + v);
  const results = [];
  const check = (name, fn) => {
    try { fn(); results.push('PASS ' + name); }
    catch (e) { results.push('FAIL ' + name + ' :: ' + (e && e.message)); }
  };
  const eq = (a, b, msg) => {
    if (a !== b) throw new Error(msg + ' — got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b));
  };

  try {
    // 1. Extract the genuine sync-require section from runtime.js.
    const src = await (await fetch('/runtime.js')).text();
    const start = src.indexOf("// Read a CJS module's source for the sync require path");
    const end = src.indexOf('function wrapCommonJS(');
    if (start < 0 || end < 0) throw new Error('sync-require section markers missing');
    let code = src.slice(start, end);
    code = code.split('${config.uuid}').join('e2euuid');
    code = 'var _builtinManifest = {};\nvar _builtinCache = new Map();\n' + code;
    code += '\n;window.__e2e = { resolveSyncRequest, createSyncRequire, unflattenUserFiles };';
    (0, eval)(code);
    const { createSyncRequire, unflattenUserFiles } = window.__e2e;
    log('extract', 'ok');

    // 2. Define the VFS (same as the generator).
    const vfsFlat = {
      "/setup.mjs": [
        "globalThis.__setupOrder = (globalThis.__setupOrder || []).concat(['setup']);",
        "globalThis.__sharedValue = 'from-setup';",
        "export const setupDone = true;",
      ].join("\n"),
      "/consumer.mjs": [
        "import { setupDone } from './setup.mjs';",
        "globalThis.__setupOrder = (globalThis.__setupOrder || []).concat(['consumer']);",
        "export const consumerSeesSetup = setupDone === true && globalThis.__sharedValue === 'from-setup';",
      ].join("\n"),
      "/node_modules/express/package.json": JSON.stringify({
        name: "express", version: "5.0.0",
        exports: { ".": { require: "./cjs.js", import: "./esm.js" } },
      }),
      "/node_modules/express/cjs.js": 'module.exports = { express: "cjs-via-exports" };',
      "/node_modules/express/esm.js": 'export const express = "esm-via-exports";',
      "/config.json": JSON.stringify({ theme: "dark", version: 2 }),
      "/node_modules/lodash/package.json": JSON.stringify({
        name: "lodash", version: "4.17.21", main: "lodash.js",
      }),
      "/node_modules/lodash/lodash.js": "module.exports = { lodash: true };",
      "/cjs-check.js": [
        "module.exports = {",
        "  cjsGlobalIsShared: globalThis.__sharedValue === 'from-setup',",
        "  cjsSeesSetupOrder: Array.isArray(globalThis.__setupOrder),",
        "};",
      ].join("\n"),
    };
    const vfs = unflattenUserFiles(vfsFlat);
    const cache = new Map();

    // 3. Provide node:module createRequire using the genuine sync resolver.
    // import.meta.url was transformed to 'file:////consumer.mjs' by the real transform.
    const createRequire = (url) => {
      // Convert file:// URL to VFS path.
      const parentPath = url.replace('file://', '');
      return createSyncRequire(parentPath, vfs, cache);
    };

    // 4. Set up the _RUNTIME interop with loadModule.
    const uuid = 'e2econsumption';
    globalThis['_RUNTIME' + uuid + '_'] = {
      async loadModule(specifier, kind, parentPath, opts) {
        if (specifier === 'node:module' && kind === 'import') {
          return { createRequire };
        }
        if (kind === 'import') {
          // ESM: setup.mjs and consumer.mjs — execute in order.
          const path = specifier === './setup.mjs' ? '/setup.mjs' :
                       specifier === './consumer.mjs' ? '/consumer.mjs' : null;
          if (!path) throw new Error('Unknown ESM: ' + specifier);
          const code = vfsFlat[path];
          if (path === '/setup.mjs') {
            // Run setup: sets __setupOrder=['setup'], __sharedValue, exports setupDone.
            (0, eval)(code.replace('export const setupDone = true;', ''));
            return { setupDone: true };
          }
          if (path === '/consumer.mjs') {
            // Run consumer: imports setupDone, pushes 'consumer', exports consumerSeesSetup.
            // setupDone is true (from setup.mjs).
            (0, eval)(
              'const setupDone = true;\n' +
              code
                .replace("import { setupDone } from './setup.mjs';", '')
                .replace('export const consumerSeesSetup =', 'globalThis.__consumerSeesSetup =')
            );
            return { consumerSeesSetup: globalThis.__consumerSeesSetup };
          }
        }
        if (kind === 'require') {
          // Sync CJS via the genuine PR #137 resolver.
          const req = createSyncRequire(parentPath, vfs, cache);
          return req(specifier);
        }
        throw new Error('Unhandled: ' + specifier + ' (' + kind + ')');
      }
    };

    // 5. Fetch and run the genuinely-transformed code.
    const transformed = await (await fetch('/tests/consumption-transformed.js')).text();
    // The transformed code uses top-level await, so wrap in async.
    const runCode = transformed
      .replace(/^\/\/ Generated.*\n/, '')
      .replace(/const __lm_/g, 'var __lm_');
    await (0, eval)(`(async () => { ${runCode} })()`);

    // 6. Verify results.
    const r = globalThis.__results;
    if (!r) throw new Error('__results not set');

    check('setupDone is true', () => eq(r.setupDone, true, 'setupDone'));
    check('consumerSeesSetup is true', () => eq(r.consumerSeesSetup, true, 'consumerSeesSetup'));
    check('express uses require condition', () => eq(r.expressIsCjs, true, 'expressIsCjs'));
    check('config.json loads', () => eq(r.configTheme, true, 'configTheme'));
    check('require.resolve returns VFS path', () => eq(r.lodashPathIsVfs, true, 'lodashPathIsVfs'));
    check('CJS shares globalThis', () => eq(r.cjsGlobalIsShared, true, 'cjsGlobalIsShared'));
    check('CJS sees setup order', () => eq(r.cjsSeesSetupOrder, true, 'cjsSeesSetupOrder'));
    check('import.meta.url transformed', () => eq(r.importMetaUrl, 'file:////consumer.mjs', 'importMetaUrl'));
    check('setup ran before consumer', () => {
      eq(Array.isArray(r.setupOrder), true, 'setupOrder is array');
      eq(r.setupOrder[0], 'setup', 'setup first');
      eq(r.setupOrder[1], 'consumer', 'consumer second');
    });

    log('results', results.filter(x => x.startsWith('FAIL')).length + ' failures');
    const failures = results.filter(x => x.startsWith('FAIL'));
    if (failures.length > 0) {
      document.title = 'E2E-FAIL: ' + failures[0];
    } else {
      document.title = 'E2E-PASS';
    }
    document.getElementById('out').textContent = results.join('\n') + '\n' + out.join('\n');
  } catch (e) {
    document.title = 'E2E-FAIL: ' + (e && e.message);
    document.getElementById('out').textContent = 'ERROR: ' + (e && e.stack);
  }
})();
</script>
</body>
</html>
