<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>DNS DoH E2E</title></head>
<body>
<div id="out">pending</div>
<script type="module">
// DNS-over-HTTPS browser proof: real DNS resolution in the sandbox.
// Proves `dns.resolve4`/`resolve6`/`lookup` return REAL answers from
// Cloudflare DoH — not invented data. Uses the real CodeSandbox pipeline.
import { CodeSandbox } from "/local-repo/runtime.js";

const out = document.getElementById("out");
const log = (m) => { out.textContent += "\n" + m; };
const results = [];
const check = (name, cond, extra) => {
  results.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : " :: " + (extra || "")));
};
const report = (v) => {
  try {
    fetch("/report", { method: "POST", body: JSON.stringify(v), keepalive: true }).catch(() => {});
  } catch (e) { /* ignore */ }
};

const isIPv4 = (s) => /^(\d{1,3}\.){3}\d{1,3}$/.test(s) && s.split(".").every(n => +n <= 255);
const isIPv6 = (s) => s.includes(":") && s.split(":").length >= 3;

// Unwrap log envelope: entries may be JSON strings of {args: "..."}.
function getLogText(result) {
  const parts = [];
  for (const entry of (result.logs || [])) {
    let raw = typeof entry === "string" ? entry : JSON.stringify(entry);
    try {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.args === "string") raw = parsed.args;
    } catch (e) { /* raw stays */ }
    parts.push(raw);
  }
  return parts.join("\n");
}

try {
  const sb = new CodeSandbox({ uuid: "dns-doh-e2e" });

  // Test 1: resolve4('example.com') returns real IPv4 addresses.
  const r1 = await sb.execute(`
    const dns = await import("node:dns");
    const addrs = await dns.promises.resolve4("example.com");
    console.log("RESOLVE4:" + JSON.stringify(addrs));
  `);
  const m1 = getLogText(r1).match(/RESOLVE4:(\[.*?\])/) || [];
  let addrs4 = [];
  try { addrs4 = JSON.parse(m1[1] || "[]"); } catch {}
  check("resolve4 returns array", Array.isArray(addrs4) && addrs4.length > 0, JSON.stringify(addrs4));
  check("resolve4 addresses are valid IPv4", addrs4.every(isIPv4), JSON.stringify(addrs4));
  log("resolve4(example.com) = " + JSON.stringify(addrs4));

  // Test 2: lookup('example.com') returns {address, family}.
  const r2 = await sb.execute(`
    const dns = await import("node:dns");
    dns.lookup("example.com", (err, address, family) => {
      console.log("LOOKUP:" + JSON.stringify({ err: err ? err.code : null, address, family }));
    });
  `);
  // Wait a tick for the callback.
  await new Promise(r => setTimeout(r, 2000));
  const m2 = getLogText(r2).match(/LOOKUP:(\{.*?\})/) || [];
  let lookupRes = {};
  try { lookupRes = JSON.parse(m2[1] || "{}"); } catch {}
  check("lookup no error", !lookupRes.err, JSON.stringify(lookupRes));
  check("lookup address valid IPv4", isIPv4(lookupRes.address || ""), JSON.stringify(lookupRes));
  check("lookup family is 4", lookupRes.family === 4, JSON.stringify(lookupRes));

  // Test 3: NXDOMAIN → ENOTFOUND (not invented, real error).
  const r3 = await sb.execute(`
    const dns = await import("node:dns");
    try {
      await dns.promises.resolve4("nonexistent-domain-12345.invalid");
      console.log("NXDOMAIN:unexpected-success");
    } catch (e) {
      console.log("NXDOMAIN:" + e.code);
    }
  `);
  const m3 = getLogText(r3).match(/NXDOMAIN:(\S+)/) || [];
  check("NXDOMAIN maps to ENOTFOUND", m3[1] === "ENOTFOUND", m3[1]);

  // Test 4: resolve6 returns IPv6 (example.com has AAAA).
  const r4 = await sb.execute(`
    const dns = await import("node:dns");
    try {
      const addrs = await dns.promises.resolve6("example.com");
      console.log("RESOLVE6:" + JSON.stringify(addrs));
    } catch (e) {
      console.log("RESOLVE6:ERROR:" + e.code);
    }
  `);
  const m4 = getLogText(r4).match(/RESOLVE6:(\[.*?\]|ERROR:\S+)/) || [];
  if (m4[1] && m4[1].startsWith("[")) {
    let addrs6 = JSON.parse(m4[1]);
    check("resolve6 addresses valid IPv6", addrs6.every(isIPv6), JSON.stringify(addrs6));
  } else {
    // AAAA may not exist in all environments — ENODATA is honest, not a failure.
    check("resolve6 honest (no fake IPv6)", m4[1] === "ERROR:ENODATA", m4[1]);
  }

  // sandbox cleanup is automatic
} catch (e) {
  check("no harness exception", false, e.message);
}

const failed = results.filter(r => r.startsWith("FAIL"));
const verdict = { ok: failed.length === 0, checks: results };
document.title = failed.length === 0 ? "E2E-PASS" : "E2E-FAIL";
log("\n" + results.join("\n"));
report(verdict);
</script>
</body>
</html>
