<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Chrome137 Interop E2E</title></head>
<body>
<div id="out">pending</div>
<script type="module">
// Chrome 137 interop verification (roadmap §2 leftover).
//
// Proves the iframe/postMessage host protocol on the REAL CodeSandbox:
//   1. iframe boots — execute() resolves
//   2. postMessage round-trip — result.logs arrive via the channel
//   3. sandbox.invoke('__stdin__', …) — parent→sandbox while execute pending
//   4. custom exposed method — sandbox exposes via interop.expose, parent invokes
//   5. cookie jar — VirtualCookieJar IIFE read/write round-trip
//   6. virtual HTTP server — host __serverRequest__ reaches sandbox server;
//      Set-Cookie stored in jar, Cookie re-injected on the next request
//
// Uses ONLY the real public surface: CodeSandbox from /local-repo/runtime.js.
// Reports via document.title ("E2E-PASS" / "E2E-FAIL: ..."), #out, POST /report.
const out = document.getElementById("out");
const log = (m) => { out.textContent += "\n" + m; };
const __t0 = Date.now();
const phase = (p) => { window.__phase = p; document.title = "E2E:" + p; log("PHASE " + p + " @" + ((Date.now() - __t0) / 1000).toFixed(1) + "s"); };
const report = (v) => {
  window.__done__ = v;
  try {
    fetch("/report", { method: "POST", body: JSON.stringify(v), keepalive: true }).catch(() => {});
  } catch (e) { /* ignore */ }
};

const results = [];
const check = (name, cond, extra) => {
  results.push((cond ? "PASS " : "FAIL ") + name + (cond ? "" : " :: " + (extra || "")));
};

const waitFor = async (fn, timeoutMs, label) => {
  const deadline = Date.now() + timeoutMs;
  while (Date.now() < deadline) {
    if (fn()) return true;
    await new Promise((r) => setTimeout(r, 100));
  }
  return false;
};

try {
  const rt = await import("/local-repo/runtime.js");
  check("real runtime exports CodeSandbox", typeof rt.CodeSandbox === "function");
  const { CodeSandbox } = rt;
  phase("runtime-loaded");

  setTimeout(() => {
    if (!window.__done__) {
      document.title = "E2E-FAIL: watchdog timeout at phase " + (window.__phase || "unknown");
      report({ ok: false, phase: "watchdog", lastPhase: window.__phase || null });
    }
  }, 280000);

  // ---- 1+2. iframe boots, postMessage round-trip ----
  {
    const sb = new CodeSandbox({ fileName: "boot.mjs", timeout: 180000, fallbackCDN: false });
    phase("boot-execute");
    const r = await sb.execute("console.log('__BOOT__iframe-alive');");
    check("iframe boots: execute() resolved with success", r && r.success === true,
      JSON.stringify({ success: r && r.success, errors: r && (r.errors || r.error) }).slice(0, 300));
    const logs = (r.logs || []).map((l) => (typeof l === "string" ? l : (l.args || JSON.stringify(l))));
    check("postMessage round-trip: __BOOT__ marker in result.logs",
      logs.some((t) => String(t).includes("__BOOT__iframe-alive")),
      "logs=" + logs.length);
    phase("boot-done");
  }

  // ---- 3. sandbox.invoke('__stdin__', …) while execute pending ----
  {
    const sb = new CodeSandbox({ fileName: "stdin.mjs", timeout: 180000, fallbackCDN: false });
    const code = [
      // Attach the listener FIRST, then log the marker. The marker proves
      // the listener is attached (not just that code started running).
      "process.stdin.once('data', (chunk) => {",
      "  console.log('__STDIN__got:' + chunk.toString().trim());",
      "  clearTimeout(__hold);",
      "  process.exit(0);",
      "});",
      "const __hold = setTimeout(() => {}, 170000);",
      "console.log('__STDIN__waiting');",
    ].join("\n");
    // Attach the streaming handler BEFORE execute() so we don't miss events.
    let sawWaiting = false;
    const h = (evt) => {
      const t = (evt && evt.args) || "";
      if (String(t).includes("__STDIN__waiting")) sawWaiting = true;
    };
    if (typeof sb.on === "function") sb.on("execution:stdout", h);
    phase("stdin-execute-start");
    const execP = sb.execute(code);
    // Wait for the sandbox to signal running before invoking.
    // The iframe boot can take up to ~60s on first execute (init loads dist).
    const ready = await waitFor(() => sb._context && sb._context.running === true, 60000, "stdin-ready");
    check("stdin: sandbox signaled running before invoke", ready);
    // Wait for user code to attach the stdin listener (marker streams through).
    {
      const deadline = Date.now() + 60000;
      while (Date.now() < deadline && !sawWaiting) {
        await new Promise((r) => setTimeout(r, 250));
      }
    }
    if (typeof sb.off === "function") sb.off("execution:stdout", h);
    else if (typeof sb.removeListener === "function") sb.removeListener("execution:stdout", h);
    check("stdin: __STDIN__waiting marker streamed (listener attached)", sawWaiting);
    // Invoke __stdin__. Note: the sandbox calls process.exit(0) in the data
    // handler, which can kill the iframe before the interop response posts back.
    // The invoke may therefore reject with "sandbox is closed" even though the
    // data WAS delivered. We verify delivery via the logs, not the invoke result.
    let invokeErr = "";
    try {
      await sb.invoke("__stdin__", "hello-stdin-137\n");
    } catch (e) { invokeErr = String((e && e.message) || e).slice(0, 200); }
    // The invoke reached the sandbox if the error is NOT "method not found".
    // "sandbox is closed" after delivery is expected (exit raced the response).
    const reachedSandbox = !invokeErr.includes("not found") && !invokeErr.includes("no such method");
    check("invoke('__stdin__') reached the sandbox (no 'method not found')", reachedSandbox, invokeErr);
    const r = await execP;
    phase("stdin-execute-resolved");
    check("stdin: execute resolved success after invoke", r && r.success === true,
      JSON.stringify({ success: r && r.success }).slice(0, 200));
    const logs = (r.logs || []).map((l) => (typeof l === "string" ? l : (l.args || JSON.stringify(l))));
    // Data delivered if the got-marker is in logs. The process calls
    // process.exit(0) ONLY inside the data callback, so "Process Exited"
    // in the logs also proves the callback ran (the got-log may be lost
    // in the exit race).
    const gotMarker = logs.some((t) => String(t).includes("__STDIN__got:hello-stdin-137"));
    const exitedViaHandler = logs.some((t) => String(t).includes("Process Exited"));
    check("stdin: data arrived in sandbox (marker or handler-exit)", gotMarker || exitedViaHandler,
      logs.join(" | ").slice(0, 500));
  }

  // ---- 4. custom exposed method: sandbox exposes, parent invokes ----
  {
    const sb = new CodeSandbox({ fileName: "expose.mjs", timeout: 180000, fallbackCDN: false });
    const code = [
      "const __hold = setTimeout(() => {}, 170000);",
      "globalThis.interop.expose('multiply137', (a, b) => a * b);",
      "globalThis.interop.expose('greet137', (name) => 'hi ' + name);",
      "console.log('__EXPOSE__ready');",
      // Keep the sandbox alive until the parent invokes, then exit.
      "await new Promise((resolve) => {",
      "  globalThis.interop.expose('done137', () => { clearTimeout(__hold); resolve(); return 'done-ack'; });",
      "});",
      "console.log('__EXPOSE__finished');",
    ].join("\n");
    phase("expose-execute-start");
    const execP = sb.execute(code);
    const ready = await waitFor(() => sb._context && sb._context.running === true, 60000, "expose-ready");
    check("expose: sandbox running", ready);
    // Give the expose() calls time to register (they postMessage interop_registered).
    // Wait until the __EXPOSE__ready marker streams through, or timeout.
    await waitFor(() => out.textContent.includes("__EXPOSE__ready"), 30000, "expose-marker");
    let mulResult = null, mulErr = "";
    try { mulResult = await sb.invoke("multiply137", 6, 7); }
    catch (e) { mulErr = String((e && e.message) || e).slice(0, 200); }
    check("invoke custom method multiply137(6,7) === 42", mulResult === 42,
      "result=" + JSON.stringify(mulResult) + " err=" + mulErr);
    let greetResult = null, greetErr = "";
    try { greetResult = await sb.invoke("greet137", "chrome"); }
    catch (e) { greetErr = String((e && e.message) || e).slice(0, 200); }
    check("invoke custom method greet137('chrome') === 'hi chrome'", greetResult === "hi chrome",
      "result=" + JSON.stringify(greetResult) + " err=" + greetErr);
    // Tell the sandbox to finish.
    let doneAck = null;
    try { doneAck = await sb.invoke("done137"); } catch (e) {}
    check("invoke done137 acknowledged", doneAck === "done-ack", JSON.stringify(doneAck));
    const r = await execP;
    phase("expose-execute-resolved");
    check("expose: execute resolved success", r && r.success === true);
  }

  // ---- 5. cookie jar through the wrapper ----
  // The COOKIE_JAR_IIFE bundle sets globalThis.__cookieJarLib in the sandbox.
  // Prove it loads and the VirtualCookieJar read/write works through the iframe.
  {
    const sb = new CodeSandbox({ fileName: "cookie.mjs", timeout: 180000, fallbackCDN: false });
    const code = [
      "const { VirtualCookieJar } = globalThis.__cookieJarLib;",
      "const jar = new VirtualCookieJar();",
      "const storeErrs = jar.store('uuid137', 80, 'session137=abc123; Path=/', { host: 'example.com' });",
      "const header = jar.cookieHeader('uuid137', 80, { host: 'example.com', path: '/' });",
      "const listed = jar.list('uuid137', 80);",
      "console.log('__COOKIE__' + JSON.stringify({",
      "  storeErrs: storeErrs,",
      "  header: header,",
      "  count: listed.length,",
      "  name: listed[0] && listed[0].name,",
      "}));",
    ].join("\n");
    phase("cookie-execute");
    const r = await sb.execute(code);
    check("cookie: execute resolved success", r && r.success === true,
      JSON.stringify({ success: r && r.success, errors: r && (r.errors || r.error) }).slice(0, 400));
    const logs = (r.logs || []).map((l) => (typeof l === "string" ? l : (l.args || JSON.stringify(l))));
    let cj = null;
    for (const t of logs) {
      const s = String(t);
      const j = s.indexOf("__COOKIE__");
      if (j !== -1) { try { cj = JSON.parse(s.slice(j + "__COOKIE__".length)); } catch (e) {} break; }
    }
    check("cookie: marker parsed", !!cj, logs.join(" | ").slice(0, 600));
    if (cj) {
      check("cookie: store had no errors", Array.isArray(cj.storeErrs) && cj.storeErrs.length === 0,
        JSON.stringify(cj.storeErrs));
      check("cookie: jar read/write round-trip",
        cj.header === "session137=abc123" && cj.count === 1 && cj.name === "session137",
        JSON.stringify(cj));
    }
    phase("cookie-done");
  }

  // ---- 6. virtual HTTP server + cookie jar through the __serverRequest__ wrapper ----
  // The documented host flow (docs/INTEROP.md "How a server request is made"):
  // sandbox listens on a virtual port, the host invokes __serverRequest__,
  // the wrapper injects cookies from the RFC 6265 jar and stores Set-Cookie.
  // Regression: the http/net registries were per-module-copy (self-contained
  // dist bundles), so the published handleRequest couldn't see servers
  // created through another copy's Server class ("No active HTTP server").
  {
    const sb = new CodeSandbox({ fileName: "httpsrv.mjs", timeout: 180000, fallbackCDN: false });
    const code = [
      "import http from 'node:http';",
      "let lastCookie = 'none-seen';",
      "const server = http.createServer((req, res) => {",
      "  lastCookie = req.headers.cookie || req.headers.Cookie || 'none';",
      "  res.writeHead(200, { 'content-type': 'text/plain', 'set-cookie': 'session137=abc123; Path=/' });",
      "  res.end('hello-probe');",
      "});",
      "globalThis.interop.expose('getLastCookie137', () => lastCookie);",
      "globalThis.interop.expose('closeServer137', () => new Promise((resolve) => server.close(() => resolve('closed'))));",
      "server.listen(3457, () => console.log('__SRV__listening'));",
    ].join("\n");
    phase("srv-execute-start");
    const execP = sb.execute(code);
    let sawListening = false;
    const hh = (d) => {
      const sd = typeof d === "string" ? d : JSON.stringify(d);
      if (sd.includes("__SRV__listening")) sawListening = true;
    };
    if (typeof sb.on === "function") sb.on("execution:stdout", hh);
    check("httpsrv: server listening on virtual port 3457", await waitFor(() => sawListening, 60000));
    const decodeBody = (b) => (typeof b === "string" ? b : String.fromCharCode.apply(null, Object.values(b || {})));
    let r1 = null, e1 = "";
    try { r1 = await sb.invoke("__serverRequest__", 3457, "/", "GET", {}, {}); }
    catch (e) { e1 = String((e && e.message) || e).slice(0, 200); }
    check("httpsrv: __serverRequest__ resolved (server found)", !!r1, e1);
    check("httpsrv: status 200 + body hello-probe",
      r1 && r1.statusCode === 200 && decodeBody(r1.body) === "hello-probe",
      String(JSON.stringify(r1 && { s: r1.statusCode })).slice(0, 200));
    const sc = r1 && r1.headers && r1.headers["set-cookie"];
    check("httpsrv: set-cookie echoed", !!sc && String(sc).includes("session137=abc123"), JSON.stringify(sc));
    let r2 = null;
    try { r2 = await sb.invoke("__serverRequest__", 3457, "/", "GET", {}, {}); } catch (e) {}
    check("httpsrv: second __serverRequest__ resolved", !!r2);
    let lastCookie = null;
    try { lastCookie = await sb.invoke("getLastCookie137"); } catch (e) {}
    check("httpsrv: jar re-injected Cookie on 2nd request (server saw session137=abc123)",
      lastCookie === "session137=abc123", JSON.stringify(lastCookie));
    let closed = null;
    try { closed = await sb.invoke("closeServer137"); } catch (e) {}
    check("httpsrv: server closed", closed === "closed", JSON.stringify(closed));
    const rr = await execP;
    check("httpsrv: execute resolved success", rr && rr.success === true,
      JSON.stringify({ success: rr && rr.success }).slice(0, 200));
    phase("srv-done");
  }

  const failures = results.filter((x) => x.startsWith("FAIL"));
  log(results.join("\n"));
  if (failures.length > 0) {
    document.title = "E2E-FAIL: " + failures[0].slice(5, 125);
    report({ ok: false, phase: "verdict", failures, results });
  } else {
    document.title = "E2E-PASS";
    report({ ok: true, results });
  }
} catch (e) {
  if (!window.__done__) {
    document.title = "E2E-FAIL: " + String((e && e.message) || e).slice(0, 120);
    report({ ok: false, phase: "top", error: String((e && e.message) || e).slice(0, 2000) });
  }
  log("TOP-LEVEL: " + String((e && e.stack) || e).slice(0, 1000));
}
</script>
</body>
</html>
